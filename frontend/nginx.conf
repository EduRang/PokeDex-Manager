server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre (index-a1b2c3.js): si cambian, cambia el
    # nombre, así que el navegador puede guardarlos un año
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de la aplicación (/collection, /pokemon/25): las resuelve React
    # Router, así que siempre se devuelve index.html. Sin caché, para que al
    # recargar se vea siempre la última versión
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
